<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ha Seungyeon</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto Slab', serif;
      background-color: #fffbf3;
    }

    /* 상단 고정 메뉴 */
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #fffbf3;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      padding: 20px 0;
      color: #f83639;
      font-size: 20px;
    }

    .nav a {
      text-decoration: none;
      color: #f83639;
      position: relative;
    }

    /* 가운데 홈 아이콘 */
    .home-icon {
      width: 24px;
      height: 24px;
    }

    /* 메뉴 아래 선 */
    .nav-line {
      width: 100%;
      height: 5px;
      background-color: #f83639;
    }

    /* 메인 이미지 영역 */
    .hero {
      margin-top: 100px; /* 헤더 높이만큼 여백 */
      width: 100%;
      height: calc(100vh - 100px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero img {
      max-width: 90%;
      height: auto;
    }

  </style>
</head>

<body>

  <header class="header">
    <nav class="nav">
      <a href="#">Me</a>
      <a href="#">Drama</a>

      <!-- 집 모양 SVG -->
      <svg class="home-icon" viewBox="0 0 24 24" fill="#f83639" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3L12 3z"/>
      </svg>

      <a href="#">Cinema</a>
      <a href="#">Profile</a>
    </nav>

    <div class="nav-line"></div>
  </header>

  <section class="hero">
    <!-- 여기에 배우 메인 이미지 넣기 -->
    <img src="your-image.jpg" alt="Ha Seungyeon">
  </section>

</body>
</html>
