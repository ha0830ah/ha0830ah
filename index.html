<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ha Seungyeon</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto Slab', serif;
      background-color: #fffbf3;
    }

    /* 상단 고정 메뉴 */
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #fffbf3;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      padding: 20px 0;
      color: #f83639;
      font-size: 20px;
    }

    .nav a {
      text-decoration: none;
      color: #f83639;
      position: relative;
    }

    .home-icon {
      width: 24px;
      height: 24px;
    }

    /* 🔥 메뉴 하단 라인 (여기서 px 조절 가능) */
    .nav-line {
      width: 1500px;            /* ← 길이 조절 */
      height: 3px;              /* ← 굵기(px) 조절 */
      background-color: #f83639;
      margin: 0 auto;           /* 중앙 정렬 */
    }

    /* 메인 컨텐츠 영역 */
    .content {
      margin-top: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* 이미지 리스트 */
    .image-list {
      width: 900px;             /* 이미지 영역 폭 */
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .image-list img {
      width: 900px;
      height: auto;
      display: block;
    }

  </style>
</head>

<body>

  <header class="header">
    <nav class="nav">
      <a href="#">Me</a>
      <a href="#">Drama</a>

      <svg class="home-icon" viewBox="0 0 24 24" fill="#f83639" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3L12 3z"/>
      </svg>

      <a href="#">Cinema</a>
      <a href="#">Profile</a>
    </nav>

    <div class="nav-line"></div>
  </header>

  <section class="content">

    <div class="image-list">
      <!-- GitHub raw 이미지 경로 사용 -->
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p1.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p2.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p3.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p4.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p5.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p6.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p7.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p8.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p9.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p10.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p11.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p12.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p13.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p14.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p15.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p16.jpg">
      <img src="https://raw.githubusercontent.com/ha0830ah/ha0830ah/main/images/p17.jpg">
    </div>

  </section>

</body>
</html>
